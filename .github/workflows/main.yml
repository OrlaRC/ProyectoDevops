name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests y cobertura
    runs-on: self-hosted
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura (umbral 70%)
        run: npm run test:coverage

  build-and-push:
    name: Build y publicar en Docker Hub
    runs-on: self-hosted
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de la imagen (:latest y :sha)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp:${{ github.sha }}

  deploy:
    name: Desplegar en AWS EC2
    runs-on: self-hosted
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Conectar por SSH y actualizar el contenedor
        shell: powershell
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "ec2_key.pem"
          [System.IO.File]::WriteAllText($keyPath, $env:EC2_SSH_KEY -replace "`r`n", "`n")

          # Restringir permisos del archivo de la llave (igual que al usarla manualmente)
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null

          $remoteCommand = "sudo docker pull $env:DOCKERHUB_USERNAME/webapp:latest && " +
            "(sudo docker stop webapp-container || true) && " +
            "(sudo docker rm webapp-container || true) && " +
            "sudo docker run -d -p 80:80 -p 6061:6061 --restart unless-stopped --name webapp-container $env:DOCKERHUB_USERNAME/webapp:latest"

          ssh -o StrictHostKeyChecking=no -i $keyPath "ubuntu@$env:EC2_HOST" $remoteCommand
          if ($LASTEXITCODE -ne 0) { throw "El despliegue por SSH fallo con codigo $LASTEXITCODE" }

          Remove-Item $keyPath -Force
